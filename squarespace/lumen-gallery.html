<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Layout: Vollbild-3D-Bühne, darüber ein feiner Rahmen aus Haarlinien,
     Kopfzeile oben, Bedienleiste unten. */
  #lg-root {
    --lg-ink: #f3eee6;
    --lg-ink-dim: rgba(243, 238, 230, .68);
    --lg-line: rgba(243, 238, 230, .5);
    --lg-veil: #15120f;
    --lg-chip: #f6f2ec;
    --lg-chip-ink: #1a1612;
    --lg-chip-dim: #6f655a;
    --lg-font: 'Jost', 'Futura', 'Century Gothic', 'Avenir Next', system-ui, sans-serif;
    --lg-gx: clamp(14px, 1.6vw, 32px);
    --lg-hh: clamp(60px, 8vh, 90px);
    --lg-pad: calc(var(--lg-gx) + clamp(14px, 2vw, 40px));

    position: fixed;
    inset: 0;
    z-index: 2147483000;
    overflow: hidden;
    background: var(--lg-veil);
    color: var(--lg-ink);
    font-family: var(--lg-font);
    font-weight: 400;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    color-scheme: dark;
  }
  #lg-root.lg-inline { position: relative; inset: auto; width: 100%; height: 78vh; min-height: 420px; z-index: 1; touch-action: auto; }
  html.lg-lock, html.lg-lock body { overflow: hidden !important; height: 100%; }
  #lg-root *, #lg-root *::before, #lg-root *::after { box-sizing: border-box; }
  #lg-root [hidden] { display: none !important; }
  #lg-root button { all: unset; box-sizing: border-box; cursor: pointer; color: inherit; font-family: var(--lg-font); }
  #lg-root button:focus-visible, #lg-root a:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
  #lg-root a { color: inherit; }
  #lg-root svg { display: block; }

  #lg-root .lg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #lg-root .lg-shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(12, 10, 8, .42), rgba(12, 10, 8, 0) 17%, rgba(12, 10, 8, 0) 82%, rgba(12, 10, 8, .36));
  }
  #lg-root .lg-veil { position: absolute; inset: 0; background: var(--lg-veil); pointer-events: none; opacity: 1; }

  /* Haarlinien-Rahmen */
  #lg-root .lg-frame span { position: absolute; background: var(--lg-line); pointer-events: none; }
  #lg-root .lg-frame .lg-fl { top: 0; bottom: 0; left: var(--lg-gx); width: 1px; }
  #lg-root .lg-frame .lg-fr { top: 0; bottom: 0; right: var(--lg-gx); width: 1px; }
  #lg-root .lg-frame .lg-ft { left: 0; right: 0; top: calc(var(--lg-hh) + env(safe-area-inset-top, 0px)); height: 1px; }

  /* Kopfzeile */
  #lg-root .lg-top {
    position: absolute; left: 0; right: 0; top: 0;
    height: calc(var(--lg-hh) + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) var(--lg-pad) 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .25);
  }
  #lg-root .lg-logo { display: inline-flex; align-items: center; gap: .55em; text-decoration: none; font-size: clamp(17px, 1.4vw, 25px); letter-spacing: .04em; line-height: 1; justify-self: start; }
  #lg-root .lg-logo b { font-weight: 500; }
  #lg-root .lg-logo i { font-style: normal; font-weight: 300; }
  #lg-root .lg-logo svg { width: .95em; height: .95em; }
  #lg-root .lg-title { font-size: clamp(16px, 1.35vw, 24px); font-weight: 400; letter-spacing: .01em; white-space: nowrap; transition: opacity .4s ease; }
  #lg-root .lg-nav { justify-self: end; display: flex; align-items: center; gap: clamp(18px, 3vw, 62px); }
  #lg-root .lg-nav a { font-size: clamp(14px, 1.05vw, 19px); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .24em; letter-spacing: .01em; }

  /* Großer Raumtitel während des Übergangs */

    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);

  }
  #lg-root .lg-roomtitle small { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--lg-ink-dim); font-weight: 400; }
  #lg-root .lg-roomtitle strong { font-size: clamp(40px, 7.5vw, 128px); font-weight: 300; letter-spacing: .03em; line-height: 1; text-wrap: balance; }

  /* Hotspots */
  #lg-root .lg-hotspots { position: absolute; inset: 0; pointer-events: none; }
  #lg-root .lg-hs {
    position: absolute; left: 0; top: 0; pointer-events: auto;
    width: clamp(50px, 4vw, 78px); height: clamp(50px, 4vw, 78px); margin: calc(clamp(50px, 4vw, 78px) / -2) 0 0 calc(clamp(50px, 4vw, 78px) / -2);
    border-radius: 50%; background: var(--lg-chip); color: var(--lg-chip-ink);
    display: grid; place-items: center; box-shadow: 0 6px 28px rgba(0, 0, 0, .28);
    will-change: transform, opacity;
  }
  #lg-root .lg-hs svg { width: 52%; height: 52%; transition: transform .35s ease; }
  #lg-root .lg-hs::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid var(--lg-chip); animation: lg-pulse 2.6s ease-out infinite; }
  #lg-root .lg-hs:hover svg { transform: scale(1.12); }
  @keyframes lg-pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }

  /* Infopanel */
  #lg-root .lg-panel {
    position: absolute; right: calc(var(--lg-gx) + 22px); top: calc(var(--lg-hh) + env(safe-area-inset-top, 0px) + 22px);
    width: min(380px, calc(100% - 2 * var(--lg-gx) - 44px)); max-height: calc(100% - 2 * var(--lg-hh) - 44px); overflow-y: auto;
    background: var(--lg-chip); color: var(--lg-chip-ink); padding: 28px 28px 30px;
    opacity: 0; transform: translateX(18px); transition: opacity .35s ease, transform .45s cubic-bezier(.2, .7, .2, 1);
    user-select: text; -webkit-user-select: text; touch-action: pan-y;
    display: grid; grid-template-columns: 96px 1fr; column-gap: 20px; row-gap: 6px; align-items: start;
  }
  #lg-root .lg-panel.is-open { opacity: 1; transform: none; }
  #lg-root .lg-swatch { width: 96px; height: 96px; grid-row: span 2; display: block; }
  #lg-root .lg-kicker { margin: 4px 0 0; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--lg-chip-dim); font-weight: 400; }
  #lg-root .lg-ptitle { margin: 0; font-family: var(--lg-font); font-size: 28px; line-height: 1.1; font-weight: 400; letter-spacing: .01em; color: var(--lg-chip-ink); text-transform: none; text-wrap: balance; }
  #lg-root .lg-specs { grid-column: 1 / -1; margin: 22px 0 0; padding: 0; display: grid; grid-template-columns: auto 1fr; border-top: 1px solid rgba(26, 22, 18, .16); }
  #lg-root .lg-specs dt, #lg-root .lg-specs dd { margin: 0; padding: 10px 0; border-bottom: 1px solid rgba(26, 22, 18, .16); font-size: 14px; }
  #lg-root .lg-specs dt { color: var(--lg-chip-dim); padding-right: 20px; }
  #lg-root .lg-specs dd { text-align: right; font-variant-numeric: tabular-nums; }
  #lg-root .lg-ptext { grid-column: 1 / -1; margin: 18px 0 0; font-size: 15px; line-height: 1.55; color: var(--lg-chip-ink); max-width: 60ch; }
  #lg-root .lg-pclose { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--lg-chip-ink); }
  #lg-root .lg-pclose svg { width: 16px; height: 16px; }

  /* Bedienleiste unten */
  #lg-root .lg-bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--lg-hh) + env(safe-area-inset-bottom, 0px));
    padding: 0 var(--lg-pad) env(safe-area-inset-bottom, 0px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .3);
  }
  #lg-root .lg-floors { justify-self: start; display: inline-flex; align-items: center; gap: 14px; font-size: clamp(14px, 1.05vw, 18px); color: var(--lg-ink-dim); }
  #lg-root .lg-floors:hover, #lg-root .lg-floors[aria-expanded="true"] { color: var(--lg-ink); }
  #lg-root .lg-floors .lg-vsep { height: 26px; }
  #lg-root .lg-floors svg { width: 34px; height: 30px; color: var(--lg-ink); }

  #lg-root .lg-progress { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .18em; font-variant-numeric: tabular-nums; }
  #lg-root .lg-prog-row { display: flex; align-items: center; gap: 12px; }
  #lg-root .lg-prog-bar { position: relative; width: clamp(48px, 9vw, 140px); height: 1px; background: var(--lg-line); overflow: hidden; }
  #lg-root .lg-prog-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--lg-ink); transform-origin: left; transform: scaleX(0); }
  #lg-root .lg-hint { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--lg-ink-dim); display: flex; align-items: center; gap: 8px; transition: opacity .6s ease; }
  #lg-root .lg-hint::before { content: ''; width: 1px; height: 14px; background: var(--lg-ink); animation: lg-hint 1.8s ease-in-out infinite; transform-origin: top; }
  @keyframes lg-hint { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  #lg-root .lg-right { justify-self: end; display: flex; align-items: center; gap: clamp(14px, 1.6vw, 26px); }
  #lg-root .lg-langs { display: flex; gap: 10px; font-size: clamp(14px, 1.05vw, 18px); }
  #lg-root .lg-lang { color: var(--lg-ink-dim); }
  #lg-root .lg-lang[aria-pressed="true"] { color: var(--lg-ink); }
  #lg-root .lg-sound { display: flex; align-items: flex-end; gap: 2px; height: 16px; padding: 4px 2px; box-sizing: content-box; }
  #lg-root .lg-sound span { width: 1.5px; height: 4px; background: var(--lg-ink); display: block; transition: height .3s ease; }
  #lg-root .lg-sound.is-on span { animation: lg-bars 1s ease-in-out infinite alternate; }
  #lg-root .lg-sound.is-on span:nth-child(2) { animation-delay: -.3s; }
  #lg-root .lg-sound.is-on span:nth-child(3) { animation-delay: -.6s; }
  #lg-root .lg-sound.is-on span:nth-child(4) { animation-delay: -.15s; }
  @keyframes lg-bars { from { height: 3px; } to { height: 16px; } }

  /* Raum-Menü */
  #lg-root .lg-pop {
    position: absolute; left: calc(var(--lg-gx) + 12px); bottom: calc(var(--lg-hh) + env(safe-area-inset-bottom, 0px) - 4px);
    min-width: 260px; max-width: calc(100% - 2 * var(--lg-gx) - 24px);
    background: rgba(21, 18, 15, .78); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid var(--lg-line); padding: 10px 0;
  }
  #lg-root .lg-pop-head { margin: 4px 22px 8px; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--lg-ink-dim); }
  #lg-root .lg-pop-item { display: flex; width: 100%; align-items: baseline; gap: 18px; padding: 10px 22px; font-size: 18px; }
  #lg-root .lg-pop-item small { font-size: 12px; letter-spacing: .14em; color: var(--lg-ink-dim); font-variant-numeric: tabular-nums; }
  #lg-root .lg-pop-item:hover span, #lg-root .lg-pop-item[aria-current="true"] span { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .24em; }
  #lg-root .lg-pop-links { display: none; border-top: 1px solid var(--lg-line); margin-top: 8px; padding: 8px 0 0; }
  #lg-root .lg-pop-links a { display: block; padding: 9px 22px; font-size: 16px; text-decoration: none; color: var(--lg-ink-dim); }

  /* Ladeanzeige */
  #lg-root .lg-loader { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity .8s ease; }
  #lg-root .lg-loader div { display: flex; flex-direction: column; align-items: center; gap: 18px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--lg-ink-dim); text-align: center; padding-inline: 24px; }
  #lg-root .lg-loader i { width: 120px; height: 1px; background: var(--lg-line); position: relative; overflow: hidden; display: block; }
  #lg-root .lg-loader i::after { content: ''; position: absolute; inset: 0; background: var(--lg-ink); animation: lg-load 1.4s ease-in-out infinite; }
  @keyframes lg-load { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  @media (max-width: 760px) {
    #lg-root .lg-top { grid-template-columns: 1fr auto; }
    #lg-root .lg-title, #lg-root .lg-nav a, #lg-root .lg-nav .lg-vsep { display: none; }
    #lg-root .lg-pop-links { display: block; }
    #lg-root .lg-floors span[data-i18n] { display: none; }
    #lg-root .lg-floors .lg-vsep { display: none; }
    #lg-root .lg-panel { top: auto; bottom: calc(var(--lg-hh) + env(safe-area-inset-bottom, 0px) + 12px); right: calc(var(--lg-gx) + 12px); width: calc(100% - 2 * var(--lg-gx) - 24px); transform: translateY(18px); grid-template-columns: 72px 1fr; padding: 22px; }
    #lg-root .lg-swatch { width: 72px; height: 72px; }
    #lg-root .lg-ptitle { font-size: 23px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #lg-root .lg-hs::after, #lg-root .lg-hint::before, #lg-root .lg-sound.is-on span, #lg-root .lg-loader i::after { animation: none; }
  }
</style>

<script>
(function () {
  'use strict';

  /* =====================================================================
     CONFIG – hier anpassen
     ---------------------------------------------------------------------
     rooms[].id bestimmt, welche 3D-Szene gebaut wird:
       'bedroom' | 'lounge' | 'kitchen'  (Reihenfolge frei wählbar)
     hotspots[].pos = Position im Raum [x, y, z] in Metern
     hotspots[].swatch = Materialvorschau im Panel (Name einer Textur)
     Die Materialtexte unten sind Beispielinhalte.
  ===================================================================== */
  var CONFIG = {
    brand: 'LUMEN',
    brandSub: 'GALLERY',
    homeHref: '/',
    defaultLang: 'de',
    links: [
      { de: 'Events', en: 'Events', href: '/events' },
      { de: 'Standorte', en: 'Locations', href: '/standorte' },
      { de: 'Kontakt', en: 'Contact', href: '/kontakt' }
    ],
    rooms: [
      {
        id: 'bedroom',
        name: { de: 'Schlafzimmer', en: 'Bedroom' },
        hotspots: [
          {
            pos: [2.05, 0.9, -1.15], swatch: 'marbleBeige',
            kicker: { de: 'Boden', en: 'Floor' },
            title: 'Marmo Sabbia',
            specs: [[{ de: 'Format', en: 'Size' }, '120 × 120 cm'], [{ de: 'Oberfläche', en: 'Finish' }, { de: 'Matt', en: 'Matte' }], [{ de: 'Stärke', en: 'Thickness' }, '9 mm']],
            text: { de: 'Feinsteinzeug in Marmoroptik mit weicher, sandfarbener Maserung. Rutschhemmend nach R10, für Wohn- und Schlafräume.', en: 'Marble-look porcelain stoneware with a soft, sand-coloured vein. R10 slip resistance, made for living and sleeping areas.' }
          }
        ]
      },
      {
        id: 'lounge',
        name: { de: 'Lounge', en: 'Lounge' },
        hotspots: [
          {
            pos: [1.55, 2.45, -3.2], swatch: 'travertine',
            kicker: { de: 'Wand', en: 'Wall' },
            title: 'Travertino Avorio',
            specs: [[{ de: 'Format', en: 'Size' }, '120 × 280 cm'], [{ de: 'Oberfläche', en: 'Finish' }, { de: 'Geschliffen', en: 'Honed' }], [{ de: 'Stärke', en: 'Thickness' }, '6 mm']],
            text: { de: 'Großformatige Platte in Travertinoptik mit horizontalen Lagen. Wenige Fugen, darum ruhig wirkende Wandflächen.', en: 'Large travertine-look slab with horizontal layers. Few joints, so the wall reads as one calm surface.' }
          },
          {
            pos: [1.9, 0.05, 1.3], swatch: 'terrazzo',
            kicker: { de: 'Boden', en: 'Floor' },
            title: 'Terrazzo Nebbia',
            specs: [[{ de: 'Format', en: 'Size' }, '90 × 90 cm'], [{ de: 'Oberfläche', en: 'Finish' }, { de: 'Matt', en: 'Matte' }], [{ de: 'Stärke', en: 'Thickness' }, '10 mm']],
            text: { de: 'Feine Terrazzo-Körnung in Hellgrau. Fleckunempfindlich und für Fußbodenheizung geeignet.', en: 'Fine light-grey terrazzo grain. Stain resistant and suitable for underfloor heating.' }
          }
        ]
      },
      {
        id: 'kitchen',
        name: { de: 'Küche', en: 'Kitchen' },
        hotspots: [
          {
            pos: [0.35, 1.02, -0.25], swatch: 'stoneDark',
            kicker: { de: 'Arbeitsplatte', en: 'Worktop' },

    /* ---------- Raum 3: Küche ---------- */

              lathe([[0, 0], [0.08, 0], [0.12, 0.09], [0.13, 0.18], [0.1, 0.27], [0.06, 0.31], [0.065, 0.34], [0, 0.34]], MAT.ceramic, bx - 0.55 + r() * 0.2, y + 0.015, ZB + 0.2, g);

          } else {
            for (var b = 0; b < 5; b++) {
              var bottle = lathe([[0, 0], [0.036, 0], [0.037, 0.2], [0.03, 0.235], [0.013, 0.262], [0.012, 0.31], [0, 0.31]], MAT.glassDark, bx - 0.72 + b * 0.36 + r() * 0.05, y + 0.015, ZB + 0.2, g, { rz: (r() - 0.5) * 0.35 });

        B(0.6, H, 0.14, MAT.stoneDark, s * 1.5, H / 2, ZB + 0.07, g, { noCast: true });
        B(0.6, H, 0.14, MAT.stoneDark, s * 4.2, H / 2, ZB + 0.07, g, { noCast: true });
      });
      B(2.4, 2.6, 0.05, MAT.slatsWarm, 0, 1.6, ZB + 0.03, g, { noCast: true });
      [1.25, 1.85, 2.45].forEach(function (y) {

        for (var k = 0; k < 4; k++) {

          lathe([[0, 0], [0.05, 0], [0.065, hh * 0.6], [0.04, hh * 0.9], [0.03, hh], [0, hh]], MAT.ceramic, -0.8 + k * 0.52 + r() * 0.08, y + 0.013, ZB + 0.18, g);

      });
      [-1, 1].forEach(function (a) { [-1, 1].forEach(function (b) { C(0.01, 0.01, H - 1.75, MAT.black, 1.6 + a * 0.76, (H + 1.75) / 2, -0.6 + b * 0.28, g, { seg: 8 }); }); });

      downlight(g, -3.0, -1.9, H); downlight(g, 3.0, -1.9, H); downlight(g, -1.0, -2.3, H); downlight(g, 1.0, -2.3, H);

      rig(g, [0xe0d6ca, 0x231d18, 0.32], [
        { pos: [-1.6, H - 0.05, 0.8], tgt: [-1.6, 0, -0.9], i: 1.7, a: 0.7, c: 0xffe0bc, d: 7 },

    var BUILDERS = { bedroom: buildBedroom, lounge: buildLounge, kitchen: buildKitchen };
    var R = CONFIG.rooms.map(function (cfg, k) {
      var g = new THREE.Group();
      g.position.x = k * 60;
      scene.add(g);

      var off = new THREE.Vector3(k * 60, 0, 0);

    });
    hsEls.forEach(function (h) { h.world = new THREE.Vector3().fromArray(h.data.pos).add(new THREE.Vector3(h.room * 60, 0, 0)); });

    /* Alle Räume einmal kompilieren, damit der erste Wechsel flüssig ist */
    R.forEach(function (r) { r.group.visible = true; });

    /* ---------- Darstellung ---------- */
    var W = 1, H = 1, baseFov = 50;

    else window.addEventListener('resize', onResize);

    function smooth(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

    function easeOut(x) { return 1 - Math.pow(1 - x, 3); }

    var veil = $('.lg-veil'), titleEl = $('.lg-title'), rt = $('.lg-roomtitle'), rtSmall = rt.querySelector('small'), rtBig = rt.querySelector('strong');
    var progFill = $('.lg-prog-bar i'), progCur = $('.lg-prog-cur');
    var fwd = new THREE.Vector3(), camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), proj = new THREE.Vector3();
    var t0 = performance.now(), last = t0, introDur = reduced ? 600 : 2600, lastActive = -1, lastRt = -1;

    $('.lg-loader').style.opacity = '0';
    setTimeout(function () { $('.lg-loader').hidden = true; }, 900);

    function frame(now) {
      var dt = Math.min(0.1, (now - last) / 1000); last = now;
      var time = (now - t0) / 1000;
      var intro = clamp((now - t0) / introDur, 0, 1);

      state.current += (state.target - state.current) * (1 - Math.exp(-dt * (reduced ? 10 : 3.0)));
      if (Math.abs(state.target - state.current) < 0.0004) state.current = state.target;
      state.cmx += (state.mx - state.cmx) * (1 - Math.exp(-dt * 2.5));
      state.cmy += (state.my - state.cmy) * (1 - Math.exp(-dt * 2.5));

      var c = clamp(state.current, 0, N - 1);
      var i = N > 1 ? Math.min(N - 2, Math.floor(c)) : 0, t = N > 1 ? c - i : 0;
      var room, move, veilA, fovOff = 0, roomIdx;
      if (N === 1 || t < 0.5) {
        roomIdx = i; room = R[i];
        var u = N === 1 ? 0 : t / 0.5;
        move = reduced ? 0 : easeIn(u) * 2.6;
        fovOff = reduced ? 0 : -easeIn(u) * 7;
        veilA = smooth(0.3, 1, u);
      } else {
        roomIdx = i + 1; room = R[i + 1];
        var u2 = (t - 0.5) / 0.5;
        move = reduced ? 0 : -(1 - easeOut(u2)) * 2.2;
        fovOff = reduced ? 0 : (1 - easeOut(u2)) * 4;
        veilA = 1 - smooth(0, 0.7, u2);
      }
      move -= reduced ? 0 : (1 - easeOut(intro)) * 1.8;
      veilA = Math.max(veilA, 1 - smooth(0, 0.75, intro));

      for (var k = 0; k < R.length; k++) R[k].group.visible = R[k] === room;

      fwd.subVectors(room.look, room.pos).normalize();
      camPos.copy(room.pos).addScaledVector(fwd, move);
      camLook.copy(room.look).addScaledVector(fwd, move);
      if (!reduced) {
        camPos.x += Math.sin(time * 0.17) * 0.05;
        camPos.y += Math.sin(time * 0.23) * 0.015;
        camLook.x += state.cmx * 0.45;
        camLook.y -= state.cmy * 0.22;
      }
      camera.position.copy(camPos);
      camera.lookAt(camLook);
      var fov = baseFov + fovOff;
      if (Math.abs(camera.fov - fov) > 0.001) { camera.fov = fov; camera.updateProjectionMatrix(); }
      camera.updateMatrixWorld();

      if (room.update) room.update(time);
      renderer.render(scene, camera);
      veil.style.opacity = veilA.toFixed(3);

      /* Raumtitel im Übergang */
      var rtA = N > 1 ? smooth(0.12, 0.5, t) * (1 - smooth(0.5, 0.88, t)) : 0;
      var incoming = state.dir >= 0 ? i + 1 : i;
      if (N > 1 && incoming !== lastRt) {
        lastRt = incoming;
        rtSmall.textContent = I18N[lang].room + ' ' + pad(incoming + 1);
        rtBig.textContent = tr(R[incoming].cfg.name);
      }
      rt.style.opacity = rtA.toFixed(3);

      /* Kopfzeile + Fortschritt */
      var active = Math.round(c);
      if (active !== lastActive || lastTitle !== active) {
        lastActive = active; lastTitle = active;
        titleEl.textContent = tr(R[active].cfg.name);
        progCur.textContent = pad(active + 1);
        $$('.lg-pop-item').forEach(function (b, k) { b.setAttribute('aria-current', String(k === active)); });
        lastRt = -1;
      }
      progFill.style.transform = 'scaleX(' + (N > 1 ? c / (N - 1) : 1).toFixed(4) + ')';

      /* Hotspots auf den Bildschirm projizieren */
      var nearRest = N > 1 ? 1 - smooth(0.02, 0.14, t < 0.5 ? t : 1 - t) : 1;
      var hsA = nearRest * smooth(0.6, 1, intro);
      for (var h = 0; h < hsEls.length; h++) {
        var hs = hsEls[h];
        if (hs.room !== roomIdx || hsA < 0.02) { if (!hs.el.hidden) hs.el.hidden = true; continue; }
        proj.copy(hs.world).project(camera);
        if (proj.z > 1 || Math.abs(proj.x) > 1.1 || Math.abs(proj.y) > 1.1) { hs.el.hidden = true; continue; }
        hs.el.hidden = false;
        var sx = (proj.x * 0.5 + 0.5) * W, sy = (-proj.y * 0.5 + 0.5) * H;
        hs.el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) scale(' + (0.7 + 0.3 * hsA).toFixed(3) + ')';
        hs.el.style.opacity = hsA.toFixed(3);
      }
      if (openHs && openHs.room !== roomIdx) closePanel();

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
